<div class="min-h-screen bg-[#f0f2f5] font-sans">

  <!-- Cabecera de sección -->
  <div class="bg-[#0f1923] border-b border-gray-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <a routerLink="/" class="inline-flex items-center gap-2 text-gray-500 hover:text-amber-500 text-sm font-semibold uppercase tracking-wider transition-colors mb-6">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver
      </a>
      <div class="flex items-end gap-4">
        <div class="w-1 h-10 bg-amber-500 shrink-0"></div>
        <div>
          <p class="text-amber-500 text-[11px] font-bold uppercase tracking-[0.25em] mb-1">Temporada 2025/2026</p>
          <h1 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tight">Calendario</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Estado de carga -->
  <div *ngIf="isLoading" class="max-w-5xl mx-auto flex justify-center py-20">
    <svg class="animate-spin h-10 w-10 text-blue-800" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-red-50 border border-red-200 p-6 text-center">
      <p class="text-red-600 font-semibold">{{ errorMessage }}</p>
    </div>
  </div>

  <!-- Lista de partidos -->
  <div *ngIf="!isLoading && !errorMessage" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <!-- Leyenda de colores -->
    <div class="flex items-center gap-6 mb-6 text-xs font-bold uppercase tracking-wider">
      <span class="flex items-center gap-2"><span class="w-3 h-3 bg-green-500 inline-block"></span> Victoria</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 bg-red-500 inline-block"></span> Derrota</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 bg-amber-400 inline-block"></span> Próximo</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 bg-gray-400 inline-block"></span> Empate</span>
    </div>

    <div class="space-y-2">
      <article *ngFor="let partido of partidos"
               class="bg-white border-l-4 transition-colors flex flex-col sm:flex-row"
               [ngClass]="getBorderClass(partido)">

        <!-- Fecha -->
        <div class="flex items-center gap-3 px-4 py-4 sm:w-36 sm:flex-col sm:justify-center sm:text-center shrink-0 border-b sm:border-b-0 sm:border-r border-gray-100">
          <span class="text-[11px] font-black text-blue-800 uppercase tracking-wider">J{{ partido.jornada }}</span>
          <span class="text-gray-700 font-bold text-sm leading-tight">{{ partido.fecha }}</span>
        </div>

        <!-- Equipos -->
        <div class="flex-1 px-5 py-4 flex flex-col justify-center">
          <div class="flex items-center gap-3 mb-1">
            <span class="font-black text-gray-900 text-base">{{ partido.local }}</span>
            <span class="text-gray-400 text-xs font-bold uppercase">vs</span>
            <span class="font-bold text-gray-600 text-base">{{ partido.visitante }}</span>
          </div>
          <div class="flex items-center gap-1.5 text-gray-400 text-xs">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
            {{ partido.lugar }}
          </div>
        </div>

        <!-- Resultado / Hora -->
        <div class="px-5 py-4 sm:w-32 flex items-center justify-end sm:justify-center shrink-0">
          <ng-container *ngIf="partido.estado === 'Finalizado'; else proximoBlock">
            <span class="font-black text-gray-900 text-xl tabular-nums">{{ partido.resultado }}</span>
          </ng-container>
          <ng-template #proximoBlock>
            <div class="text-right sm:text-center">
              <span class="block font-black text-blue-800 text-lg">{{ partido.hora }}</span>
              <span class="text-[10px] font-black text-amber-500 uppercase tracking-wider">Próximo</span>
            </div>
          </ng-template>
        </div>

      </article>

      <!-- Sin partidos -->
      <div *ngIf="partidos.length === 0" class="text-center text-gray-500 py-16 font-semibold bg-white border border-gray-200">
        No hay partidos disponibles todavía.
      </div>

    </div>
  </div>

</div>
