<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AlbalateFS</title>
  <script>
    // Redirige rutas de Angular Router al index.html conservando la ruta completa.
    // Técnica estándar para GitHub Pages + Angular Router.
    var segmentCount = 1; // número de segmentos del repositorio en la URL (1 = /AlbalateFS/)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
