<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="32" height="64"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="32" y="0" width="32" height="64"/>
    </clipPath>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="64" height="64" rx="12" fill="#f1f5f9"/>
  <!-- Mitad izquierda: azul -->
  <text x="32" y="55"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900"
        font-size="58"
        text-anchor="middle"
        fill="#1d4ed8"
        clip-path="url(#clip-left)">A</text>
  <!-- Mitad derecha: negro -->
  <text x="32" y="55"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900"
        font-size="58"
        text-anchor="middle"
        fill="#0f172a"
        clip-path="url(#clip-right)">A</text>
</svg>
