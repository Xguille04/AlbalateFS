# ─── PRODUCCIÓN ────────────────────────────────────────────────────────────────
# Render inyecta estas variables de entorno desde su panel de configuración
spring.application.name=AlbalateFS Backend

# Base de datos (Neon PostgreSQL)
# DATABASE_URL debe tener formato: jdbc:postgresql://host/db?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto: Render asigna el suyo propio via la variable PORT
server.port=${PORT:8080}

# JWT
albalatefs.app.jwtSecret=${JWT_SECRET}
albalatefs.app.jwtExpirationMs=86400000

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
