# ─── PRODUCCIÓN ────────────────────────────────────────────────────────────────
# Render inyecta estas variables de entorno desde su panel de configuración
spring.application.name=AlbalateFS Backend

# Base de datos (Neon PostgreSQL)
# DATABASE_URL debe tener formato: jdbc:postgresql://host/db?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Neon cierra conexiones inactivas tras ~5 min
# maxLifetime < tiempo de cierre de Neon para evitar "connection has been closed"
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=55000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto: Render asigna el suyo propio via la variable PORT
server.port=${PORT:8080}

# JWT
albalatefs.app.jwtSecret=${JWT_SECRET}
albalatefs.app.jwtExpirationMs=86400000

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

# Email (Gmail SMTP - puerto 465 SSL)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
