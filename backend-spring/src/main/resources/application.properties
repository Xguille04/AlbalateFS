spring.application.name=AlbalateFS Backend

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/albalatefs_db
spring.datasource.username=postgres
# Cambia la contraseña según tu configuración local de PostgreSQL
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate/JPA
# update: Actualiza el esquema de la base de datos automáticamente sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto en el que correrá el backend
server.port=8080

# JWT Configuration
albalatefs.app.jwtSecret=QWxiYWxhdGVGU1MtU2VjcmV0S2V5MjAyNlByb2R1Y3Rpb25TZWNyZXRLZXlGb3JIbWFjU2hhMjU2
albalatefs.app.jwtExpirationMs=86400000

# ── Stripe (test mode) ────────────────────────────────────────────────
# Sustituir por tu clave secreta de Stripe (https://dashboard.stripe.com/apikeys)
stripe.secret.key=YOUR_STRIPE_SECRET_KEY
stripe.publishable.key=YOUR_STRIPE_PUBLISHABLE_KEY

# ── Email (Brevo HTTP API) ───────────────────────────────────────────
