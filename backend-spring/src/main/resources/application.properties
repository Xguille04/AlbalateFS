spring.application.name=AlbalateFS Backend

# ─────────────────────────────────────────────────────────────────────────────
# DESARROLLO LOCAL
# Copia application-local.properties.example a application-local.properties
# y rellena los valores reales. Ese archivo está en .gitignore.
# ─────────────────────────────────────────────────────────────────────────────
spring.config.import=optional:application-local.properties

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/albalatefs_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto en el que correrá el backend
server.port=8080

# JWT Configuration
albalatefs.app.jwtSecret=${JWT_SECRET}
albalatefs.app.jwtExpirationMs=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://albalate-fs.vercel.app}

# Seed data (solo perfiles no productivos)
app.seed.default-password=${SEED_DEFAULT_PASSWORD:}

# Cuota socio (Stripe)
app.socio.fee-cents=${SOCIO_FEE_CENTS:3000}

# ── Stripe (test mode) ────────────────────────────────────────────────
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}

# ── Email (Brevo HTTP API) ───────────────────────────────────────────
# Obtener API key en: https://app.brevo.com/settings/keys/api
brevo.api.key=${BREVO_API_KEY:}
mail.from.email=${MAIL_FROM_EMAIL:guilleayuda04@gmail.com}

